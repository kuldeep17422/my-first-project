<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuldeep Borana | Calculator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      margin: 0 25px;
    }

    nav a:hover {
      color: #dfe5ff;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin-top: 60px;
      padding: 25px;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 25px;
      font-size: 40px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    #display {
      width: 100%;
      height: 75px;
      border: none;
      border-radius: 15px;
      background: #f1f3f6;
      margin-bottom: 20px;
      padding: 15px;
      font-size: 32px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #e9ecf2;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .operator {
      background: #667eea;
      color: white;
    }

    .clear {
      background: #ff6b6b;
      color: white;
    }

    .equal {
      background: #764ba2;
      color: white;
      grid-row: span 2;
      height: 142px;
    }

    .zero {
      grid-column: span 2;
    }

    .back {
      background: #ffa94d;
      color: white;
    }

    .footer {
      color: white;
      margin-top: 25px;
      text-align: center;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>

  <div class="container">

    <h1>Calculator 🧮</h1>

    <div class="calculator">

      <input type="text" id="display" value="0" readonly>

      <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="back" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="addValue('%')">%</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button class="zero" onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

      </div>

    </div>

    <div class="footer">
      Made by Kuldeep Borana 🚀
    </div>

  </div>

  <script>
    const display = document.getElementById("display");

    function addValue(value) {
      if (display.value === "0" || display.value === "Error") {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = "0";
    }

    function deleteLast() {
      if (display.value.length > 1) {
        display.value = display.value.slice(0, -1);
      } else {
        display.value = "0";
      }
    }

    function calculate() {
      try {
        let expression = display.value;

        if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
          display.value = "Error";
          return;
        }

        display.value = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (!isFinite(display.value)) {
          display.value = "Error";
        }

      } catch {
        display.value = "Error";
      }
    }

    document.addEventListener("keydown", function(event) {

      const key = event.key;

      if (
        (key >= "0" && key <= "9") ||
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "." ||
        key === "%"
      ) {
        addValue(key);
      }

      if (key === "Enter" || key === "=") {
        calculate();
      }

      if (key === "Backspace") {
        deleteLast();
      }

      if (key === "Escape") {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
